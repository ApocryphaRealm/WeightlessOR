; Weightless for Oblivion - settings. The values here are the compiled defaults; the in-game page (Apocrypha Menu
; Framework > Weightless) changes them and saves here. 1 = items of that kind weigh nothing in your inventory.

[Categories]
bBooks=1
bScrolls=1
bPotions=1
bFood=1
bIngredients=1
bApparatus=1
bSoulGems=1
bSigilStones=1
; gems, ores and clutter are all Misc items in Oblivion
bMisc=1
bKeys=1
bArrows=1
bLights=1
; rings and amulets
bJewelry=1
bClothing=0
bArmor=0
bWeapons=0

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off
uLogLevel=2
